<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Multi-Source Text-to-SQL Assistant</title>
  <link rel="stylesheet" href="styles.css?v=3" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-inner">
        <h1 class="header-title">Multi-Source Text-to-SQL Assistant</h1>
        <p class="header-subtitle">Connected sources: PostgreSQL • SQL Server • DuckDB</p>
      </div>
    </header>

    <main id="chat-container" class="chat-container">
      <div id="chat-messages" class="chat-messages">
        <div class="message assistant">
          <div class="message-role">Assistant</div>
          <div class="message-content">
            <p class="message-text">Ask questions about your Sales, CRM, and Inventory data.</p>
          </div>
        </div>
      </div>
    </main>

    <footer class="composer-wrapper">
      <form id="chat-form" class="composer">
        <textarea
          id="chat-input"
          class="composer-textarea"
          rows="1"
          placeholder="Ask a question about your data..."
          autocomplete="off"
        ></textarea>
        <button id="send-button" type="submit" class="send-button" aria-label="Send">
          ↑
        </button>
      </form>
    </footer>
  </div>

  <script src="app.js?v=3"></script>
</body>
</html>
